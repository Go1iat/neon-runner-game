<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Runner | Go1iat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="pantalla-game-over" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(15, 23, 42, 0.9); border: 2px solid #ff0055; padding: 40px; text-align: center; border-radius: 15px; box-shadow: 0 0 30px rgba(255, 0, 85, 0.4); z-index: 10;">
    <h1 style="color: #ff0055; margin-bottom: 10px; font-size: 40px;">PERDISTE</h1>
    <p style="color: white; font-size: 20px;">Puntuación: <span id="puntuacion-final">0</span></p>
    <p style="color: #94a3b8; margin-top: 20px; font-size: 14px;">Reiniciando en 3 segundos...</p>
</div>
        <div id="score-board" style="position: absolute; top: 10px; left: 10px; font-size: 20px; font-weight: bold; color: #38bdf8;">
            Puntos: <span id="score">0</span>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
